name: Implementation task
description: 用于一个通常可由单个 PR 完成、可独立验收的实现任务。
title: "[Task] "
labels:
  - "type:task"
  - "codex:needs-spec"
body:
  - type: markdown
    attributes:
      value: |
        Task 是主要 coding-agent execution contract，遵循 Minimum sufficient specification。
        默认目标是 1 Task ≈ 1 PR ≈ 1 main squash commit。
        Parent、blocked-by、Status、Priority、Size 使用 GitHub native metadata；不要在正文复制 repository-wide rules、标准 CI 或 Git/PR 流程。
        Task 承接已批准的有限成果；纯拆细不新增义务，新增范围必须先经单独明确批准。只读取本项需要的合同，不全文加载上游设计。

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: 用一句清晰目标描述本 Task 要完成的唯一主要变化；若存在多个可独立 merge/review 的目标，应继续拆分。
      placeholder: |
        实现……
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: 说明本项承接的批准成果/要求、可复用输入和必要合同、行为边界与 edge cases；已有 REQ / DP 时引用。不要复制 Parent、架构全文或通用 workflow，也不在实施中重新定义产品范围。
      placeholder: |
        - 承接成果及来源：...
        - 必要输入/合同与已有实现：...
        - 本次行为要求：...
    validations:
      required: true

  - type: textarea
    id: critical_outcome
    attributes:
      label: Critical Outcome
      description: 定义本 Task 必须打通的真实 supported path。四个字段必须各占一行；Verification test 只能填写仓库 tests/ 下一个明确 pytest node id，不得填写任意 shell 命令。
      placeholder: |
        Caller: 真实受支持入口或调用方
        Capability: 本 Task 新增或改变的能力
        Observable result: 从该入口可观察到的预期结果
        Verification test: tests/.../test_*.py::test_*
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: 定义本项结果与必要失败边界，满足后停止扩展；Critical Outcome 覆盖真实 supported path，不能替代其余 AC。不要写 implementation checklist、通用 CI 或 PR created。
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional execution context
      description: 可选。仅补充本项必要 Context、约束、版本化 References 或特殊 Verification；存在相邻能力混淆或范围扩张风险时，必须说明 Scope Boundary / Non-goals，避免顺手承担其他成果。
      placeholder: |
        仅在需要时填写，例如：

        ### Context
        ...

        ### Scope Boundary / Non-goals
        - ...

        ### Constraints / Decisions
        - ...

        ### References
        - ...

        ### Task-specific Verification
        - ...
    validations:
      required: false
