name: Research
description: 用于在实施决策前进行证据驱动的调查、比较、验证或可行性研究。
title: "[Research] "
labels:
  - "type:research"
  - "codex:needs-spec"
body:
  - type: markdown
    attributes:
      value: |
        Research 是 evidence / decision leaf work item：当“是否应该实施”仍需要证据时使用；若实现目标已经决定，应创建 Task。
        研究结果可以是 IMPLEMENT、DO NOT IMPLEMENT、NEEDS MORE EVIDENCE 或 ARCHITECTURE DECISION。
        Parent、blocked-by 和 Project metadata 使用 GitHub native state。研究正文定义 pre-research specification，不要把完整过程日志永久堆入 Issue body。
        事先固定证据范围、适用预算与停止条件；证据不足时交付已知限制及有界后续建议，不自动延长研究或创建实施任务。

  - type: textarea
    id: question_decision
    attributes:
      label: Question / Decision Needed
      description: 用一个清晰问题或待决事项说明本研究最终必须回答什么。
      placeholder: |
        需要回答：
        ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: 说明为什么现在需要研究、哪个具体消费者/决定使用结论；承接已有验证项或需求时注明来源，不复制大段 Parent 或文档。
      placeholder: |
        当前背景：
        ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 固定系统/版本、方案、数据或时间范围，并给出适用的有限样本、请求、试验或资源预算；不强制填写所有预算维度。
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: 明确本研究不包含的实现、调参、生产变更或相邻问题。
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: evidence_evaluation
    attributes:
      label: Evidence / Evaluation Criteria
      description: 明确必要证据、充分性判断及预算耗尽/来源不可得时的停止条件；区分 fixture、实际来源、Demo 或其他适用证据，不能用一种证据冒充另一种。
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: expected_outcome_artifact
    attributes:
      label: Expected Outcome / Artifact
      description: 定义有限结论/工件，例如 recommendation、benchmark、versioned report 或 ADR input；证据不足也应记录已知事实、限制及有界 follow-up 建议。后续实施须另行明确范围和授权。
      placeholder: |
        预期结果：
        - ...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Optional research details
      description: 可选。仅在确实改变研究设计时补充 Hypotheses、Data Requirements、Method、Constraints 或 References；不要为了模板完整填写 N/A。
      placeholder: |
        仅在需要时填写，例如：

        ### Hypotheses
        - ...

        ### Data Requirements
        - ...

        ### Method
        - ...

        ### Constraints
        - ...

        ### References
        - ...
    validations:
      required: false
