name: Feature
description: 用于定义一个需要一个或多个 leaf work item 实现的完整行为能力。
title: "[Feature] "
labels:
  - "type:feature"
  - "codex:needs-spec"
body:
  - type: markdown
    attributes:
      value: |
        Feature 负责描述 WHAT：系统应具备什么行为或能力，而不是逐文件 HOW。
        Parent 使用 GitHub Parent/Sub-issues，正式阻塞使用 blocked-by/blocking；不要在正文重复 Project metadata、标准验证或 Git/PR 流程。
        如果一个能力只有一个主要实现目标且一个 PR 即可完成，应优先直接创建 Task。
        实施前列全已批准的有限成果及其工作分解；新增交付义务必须先经单独明确批准，不能靠继续创建 Task 扩大范围。

  - type: textarea
    id: capability
    attributes:
      label: Capability
      description: 描述完成后系统能够做什么，以及关键可观察行为；不要写 implementation sequence。
      placeholder: |
        系统应能够……
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: 引用批准的需求/交付包来源，明确主责模块、必要协同边界及完整有限成果；Inputs / Outputs 属于行为 contract 时写入。具体叶项分解只引用一份规划记录，不写逐文件步骤或复制子项状态。
      placeholder: |
        需求来源：批准的规格版本/章节；已有 REQ / DP 编号时注明
        主责模块：...（跨模块时补充协同职责）
        有限成果：
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: 明确相邻能力、后置扩展和不属于本次交付的结果；已有承接位置时引用，不能将接口预留当成实现该扩展的要求。
      placeholder: |
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: 覆盖有限成果的可观察行为、必要失败边界及最终集成结果，明确何时停止开发并进入既有完成审计；子项全部关闭不能代替行为证据。不要填写通用 CI / PR 流程。
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: 可选。补充必要 Context、Edge Cases、批准的约束或 References；可引用唯一的有限工作分解记录。来源引用注明版本/章节，不复制设计全文或机械状态。
      placeholder: |
        仅在需要时填写，例如：

        ### Context
        ...

        ### Key Scenarios / Edge Cases
        - ...

        ### Constraints / Decisions
        - ...

        ### References
        - ...
    validations:
      required: false
