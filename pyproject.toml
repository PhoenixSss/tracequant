[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tracequant"
version = "0.1.0"
description = "Auditable quantitative research and trading, bootstrapped on NautilusTrader."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "nautilus-trader==2.0.0rc4",
]

[dependency-groups]
dev = [
    "mypy",
    "pyyaml",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[tool.uv.build-backend]
module-name = "tracequant"
module-root = "src"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
explicit_package_bases = true
exclude = ["^tests/tools/lck/"]
files = ["src", "tools/lck", "tests"]
mypy_path = "src"
python_version = "3.13"
strict = true
