[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tracequant"
version = "0.1.0"
description = "An auditable research-to-live quantitative trading system for cryptocurrency perpetual futures."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pyyaml",
    "pytest",
    "ruff",
]

[tool.uv.build-backend]
module-name = "tracequant"
module-root = "src"

[tool.tracequant.lck]
# LCK lifecycle authority for which exact GitHub check contexts must pass.
# GitHub supplies live results; LCK does not discover this policy from
# plan/permission-dependent branch-protection APIs.
required-checks = ["quality"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.13"
strict = true
